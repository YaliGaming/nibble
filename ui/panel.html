<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Nibble</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="card" data-view="home">

    <section id="composer" class="for-chat for-home">
      <textarea id="prompt" rows="2" spellcheck="false"></textarea>
      <div class="composer-row">
        <select id="cwd"></select>
        <span id="mode-note" class="muted"></span>
        <button id="send" class="primary icon" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
      <div id="chat-note" class="note" hidden></div>
    </section>

    <section id="home" class="for-home">
      <header>
        <h3 id="activity-title"></h3>
        <button id="clear" class="link" type="button"></button>
        <button id="open-settings" class="icon ghost" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </header>
      <div id="connect-card" class="callout" hidden>
        <b id="connect-title"></b>
        <p id="connect-body"></p>
        <p id="connect-detail" class="muted small"></p>
        <div class="row">
          <button id="connect-btn" class="primary" type="button"></button>
          <span id="connect-error" class="error small"></span>
        </div>
      </div>
      <div id="list" class="scroll"></div>
    </section>

    <section id="thread" class="for-thread">
      <header>
        <button class="icon ghost back" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h3 id="thread-title" dir="auto"></h3>
        <span id="thread-chip" class="chip"></span>
      </header>
      <div id="thread-meta" class="muted small"></div>
      <div id="thread-body" class="scroll">
        <div id="thread-messages"></div>
        <div id="thread-working" class="working" hidden><span class="spinner"></span><span id="thread-working-text" dir="auto"></span></div>
      </div>
      <div id="thread-actions" class="row wrap"></div>
      <div id="reply-row" class="row" hidden>
        <textarea id="reply" rows="1" spellcheck="false"></textarea>
        <button id="reply-send" class="primary icon" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
    </section>

    <section id="settings" class="for-settings">
      <header>
        <button class="icon ghost back" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h3 id="settings-title"></h3>
      </header>
      <div class="scroll">
        <h4 id="l-pets"></h4>
        <div id="pet-grid"></div>
        <div class="row">
          <input id="hatch-desc" type="text" maxlength="300">
          <button id="hatch" type="button"></button>
          <button id="refresh" class="icon ghost" type="button">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
        <div id="hatch-note" class="small" hidden></div>
        <div class="row pet-files">
          <button id="import-pet" type="button"></button>
          <button id="export-pet" type="button"></button>
        </div>
        <div id="import-note" class="small error" hidden></div>

        <h4 id="l-size"></h4>
        <div class="row">
          <input id="size" type="range" min="0.6" max="2" step="0.05">
          <button id="size-reset" type="button"></button>
        </div>

        <div class="field"><label id="l-lang" for="lang"></label><select id="lang"></select></div>
        <div class="field"><label id="l-quick" for="quick-mode"></label><select id="quick-mode"></select></div>
        <div class="field">
          <label id="l-shortcut" for="shortcut"></label>
          <input id="shortcut" type="text" readonly dir="ltr">
        </div>
        <div id="shortcut-note" class="error small" hidden></div>
        <label class="check"><input id="show-background" type="checkbox"><span id="l-background"></span></label>
        <p id="background-note" class="muted small under"></p>

        <h4 id="l-alerts"></h4>
        <p id="alerts-note" class="muted small"></p>
        <label class="check"><input id="sound" type="checkbox"><span id="l-sound"></span></label>
        <label class="check"><input id="notify" type="checkbox"><span id="l-notify"></span></label>

        <h4 id="l-conn"></h4>
        <div class="callout quiet">
          <div class="row">
            <span id="conn-dot" class="dot"></span>
            <span id="conn-status"></span>
            <span class="spacer"></span>
            <button id="conn-btn" type="button"></button>
          </div>
          <p id="conn-detail" class="muted small"></p>
          <p id="conn-error" class="error small" hidden></p>
        </div>

        <label class="check"><input id="approvals" type="checkbox"><span id="l-approvals"></span></label>
        <p id="approvals-note" class="muted small under"></p>

        <h4 id="l-privacy"></h4>
        <label class="check"><input id="store-text" type="checkbox"><span id="l-store-text"></span></label>
        <p id="store-text-note" class="muted small under"></p>
        <div class="row clear-row">
          <button id="clear-history" type="button"></button>
          <span id="cleared" class="muted small" hidden></span>
        </div>

        <p id="about" class="muted small"></p>
        <div class="row end">
          <span id="off-note" class="muted small"></span>
          <button id="turn-off" type="button"></button>
        </div>
      </div>
    </section>

  </div>

  <script src="i18n.js"></script>
  <script src="sprites.js"></script>
  <script src="panel.js"></script>
</body>
</html>
